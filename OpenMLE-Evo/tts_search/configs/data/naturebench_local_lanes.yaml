naturebench_root: ${oc.env:NATUREBENCH_DATA_ROOT}
tasks_root: tasks
task_list: []
task_set_path: null
eval_service_url: ${oc.env:NATUREBENCH_EVAL_SERVICE_URL,http://127.0.0.1:8321}
batch_name: ${oc.env:NATUREBENCH_BATCH_NAME,naturebench-openrsi-local}
execution_mode: docker
workspace_root: ${oc.env:NATUREBENCH_WORKSPACE_ROOT,outputs/naturebench-openrsi-workspaces}
docker_image: null
docker_image_template: openrsi-naturebench-{task_name}:v3
gpu_devices: ${oc.env:NATUREBENCH_GPU_DEVICES}
submit_repeats: 0
eval_timeout: ${oc.decode:${oc.env:NATUREBENCH_EVAL_TIMEOUT,14400}}
execution_timeout: ${oc.decode:${oc.env:NATUREBENCH_EXECUTION_TIMEOUT,14400}}
candidate_preflight: true
candidate_preflight_imports: true
candidate_preflight_timeout: ${oc.decode:${oc.env:NATUREBENCH_PREFLIGHT_TIMEOUT,90}}
public_system_prompt: ""
public_user_prompt: ""
